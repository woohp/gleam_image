name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libjpeg-dev libpng-dev libjxl-dev \
            libpoppler-cpp-dev libtiff-dev libwebp-dev
      - uses: actions/checkout@v3
        with:
          repository: woohp/expp
          ref: 14642c4894db6330cce1329d0caf5079e2be7e38
          path: deps/expp
      - run: gleam deps download
      - run: make priv/imagex_c.so
      - run: gleam test
      - run: gleam format --check src test
